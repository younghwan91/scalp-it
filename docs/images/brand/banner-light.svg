<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" fill="none">
  <defs>
    <linearGradient id="sc-bl-bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="sc-bl-mark" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="sc-bl-bolt" x1="22" y1="14" x2="42" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="sc-bl-bigbolt" x1="910" y1="56" x2="968" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- Card Surface -->
  <rect width="1200" height="280" rx="16" fill="url(#sc-bl-bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="15.5" stroke="#DDD6FE"/>

  <!-- Left: Brand Mark (64x64) -->
  <g transform="translate(48, 46)">
    <rect width="64" height="64" rx="14" fill="url(#sc-bl-mark)"/>
    <rect x="1" y="1" width="62" height="62" rx="13" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1"/>
    <path d="M10 35H17L21 25L25 41L29 31" stroke="#A78BFA" stroke-opacity="0.65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 33L40 23L44 39L48 29H54" stroke="#A78BFA" stroke-opacity="0.65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M35 13L22 34H32L29 51L42 30H32L35 13Z" fill="url(#sc-bl-bolt)" stroke="#ECFEFF" stroke-width="1.2" stroke-linejoin="round"/>
  </g>

  <!-- Left: Title & Tagline -->
  <text x="130" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#0F172A" letter-spacing="-0.02em">scalp-it</text>
  <text x="130" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#6D28D9" letter-spacing="0.06em">REAL-TIME TICK STREAMING &amp; PAIR DETECTION</text>

  <text x="48" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#334155">High-frequency KRX tick/orderbook streaming &amp; pair-signal validation.</text>

  <!-- Left: Tech Pills -->
  <g transform="translate(48, 184)">
    <rect width="114" height="30" rx="15" fill="#EDE9FE" stroke="#C4B5FD"/>
    <text x="57" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#5B21B6">Python 3.11+</text>

    <rect x="124" width="146" height="30" rx="15" fill="#CFFAFE" stroke="#67E8F9"/>
    <text x="197" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#155E75">WebSocket 0B / 0D</text>

    <rect x="280" width="142" height="30" rx="15" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="351" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#334155">Dry-Run Guarded</text>
  </g>

  <!-- Right: Domain Artwork (Tick Waveforms + Lightning + Orderbook Depth) -->
  <g>
    <rect x="724" y="28" width="428" height="224" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <!-- Gridlines -->
    <path d="M748 84H1060M748 140H1060M748 196H1060" stroke="#F1F5F9" stroke-width="1"/>
    <!-- Leader tick waveform -->
    <path d="M748 148 H774 L786 112 L798 172 L810 124 L822 152 L836 96 L848 164 L860 132 L876 140 H904" stroke="#7C3AED" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Follower tick waveform -->
    <path d="M976 140 H994 L1006 114 L1018 168 L1030 122 L1042 156 L1054 108 L1066 140" stroke="#06B6D4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Center Lightning Bolt -->
    <circle cx="940" cy="140" r="46" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
    <path d="M947 92 L916 142 H939 L932 188 L964 136 H941 L947 92 Z" fill="url(#sc-bl-bigbolt)"/>

    <!-- Orderbook Depth Bars (Right edge) -->
    <rect x="1084" y="64" width="46" height="10" rx="3" fill="#FCA5A5"/>
    <rect x="1096" y="80" width="34" height="10" rx="3" fill="#FECACA"/>
    <rect x="1104" y="96" width="26" height="10" rx="3" fill="#FECACA"/>
    <rect x="1110" y="112" width="20" height="10" rx="3" fill="#FEE2E2"/>

    <line x1="1080" y1="138" x2="1132" y2="138" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 3"/>

    <rect x="1108" y="152" width="22" height="10" rx="3" fill="#A5F3FC"/>
    <rect x="1098" y="168" width="32" height="10" rx="3" fill="#67E8F9"/>
    <rect x="1088" y="184" width="42" height="10" rx="3" fill="#22D3EE"/>
    <rect x="1080" y="200" width="50" height="10" rx="3" fill="#06B6D4"/>
  </g>
</svg>
