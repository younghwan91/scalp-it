[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scalp-it"
version = "0.1.0"
description = "한국 주식 2~8주 스윙 후보 리서치 툴 — 뉴스 재료 강도 + 수급 확증"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Younghwan Chae" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "websockets>=12.0",
    "kiwoom-client>=0.4.0",
    "krx-news-client>=0.3.1",
    # 시장규칙·주문가드·체결판정·검증통계 공통 코어(scalp-it·daytrade-it·swing-it 공유)
    "krx-quant-core @ git+https://github.com/younghwan91/krx-quant-core@v0.1.0",
]

[project.optional-dependencies]
pg = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8.0", "ruff==0.16.2", "psycopg2-binary>=2.9", "pytest-httpx>=0.30"]

[project.scripts]
scalp-baseline = "scalp_it.cli:main"
scalp-score = "scalp_it.score.cli:main"
scalp-layers = "scalp_it.cli_layers:main"
scalp-today = "scalp_it.cli_today:main"
scalp-dart = "scalp_it.cli_dart:main"
scalp-dart-layers = "scalp_it.cli_dart_layers:main"
scalp-watch = "scalp_it.cli_watch:main"
scalp-intraday = "scalp_it.cli_intraday:main"
scalp-closebet = "scalp_it.cli_closebet:main"
scalp-cbet-watch = "scalp_it.cli_cbet_watch:main"
scalp-theme-snapshot = "scalp_it.cli_theme:main"
scalp-tick-collect = "scalp_it.cli_tick:main"
scalp-tick-health = "scalp_it.cli_tick_health:main"
scalp-pair-detect = "scalp_it.cli_pair_detect:main"
scalp-morning = "scalp_it.morning_report:main"
scalp-coverage = "scalp_it.cli_coverage:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/scalp_it"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
