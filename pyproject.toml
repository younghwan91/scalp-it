[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swing-it"
version = "0.1.0"
description = "한국 주식 2~8주 스윙 후보 리서치 툴 — 뉴스 재료 강도 + 수급 확증"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Younghwan Chae" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
pg = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8.0", "ruff==0.16.2", "psycopg2-binary>=2.9"]

[project.scripts]
swing-baseline = "swing_it.cli:main"
swing-news = "swing_it.cli_news:main"
swing-score = "swing_it.score.cli:main"
swing-layers = "swing_it.cli_layers:main"
swing-today = "swing_it.cli_today:main"
swing-dart = "swing_it.cli_dart:main"
swing-dart-layers = "swing_it.cli_dart_layers:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swing_it"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
