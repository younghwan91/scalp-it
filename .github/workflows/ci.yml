name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --extra dev
      - name: Forward verdicts (no keys, read-only)
        run: uv run python scripts/forward_verdicts.py
      - name: Tests
        run: uv run pytest -q
